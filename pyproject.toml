[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingai-btc"
version = "0.1.0"
description = "Quantitative BTC/USDT analysis platform (paper trading only)"
requires-python = ">=3.12"
dependencies = [
  "ccxt>=4.3",
  "jsonschema>=4.21",
  "pandas>=2.2",
  "pyarrow>=16",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "loguru>=0.7",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "joblib>=1.3",
  "streamlit>=1.35",
  "plotly>=5.20",
  "rfc8785>=0.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradingai = ["schemas/manifest_v3.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
