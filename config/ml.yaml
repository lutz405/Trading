horizon: 5
gap: 5
test_size: 0.2
val_size: 0.2
vol_mult: 0.5
use_gpu: true
model_dir: models
w_rf: 0.5
w_xgb: 0.5
abstain_threshold: 0.5

rf_params:
  n_estimators: 200
  max_depth: 8
  class_weight: balanced
  random_state: 42
  n_jobs: -1

xgb_params:
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
